name: Windows x64 build

on:
  push:
    branches:
      - "**"
    tags:
      - "ZIMA-CAD-Parts-*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_COMMIT: 05925b52317eb9a900a8583782e630aafd7a8929
      VCPKG_TRIPLET: x64-windows
      VCPKG_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Qt (MSVC 2022, x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          target: "desktop"
          arch: "win64_msvc2022_64"
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Detect vcpkg ABI cache inputs
        id: vcpkg-abi
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $parts = @(
            "vs-$env:VisualStudioVersion",
            "vc-$env:VCToolsVersion",
            "sdk-$env:WindowsSDKVersion"
          )
          $abiKey = (($parts -join "-") -replace "[^A-Za-z0-9_.-]", "-").Trim("-")

          Write-Host "Runner image: $env:ImageOS $env:ImageVersion"
          Write-Host "Visual Studio: $env:VisualStudioVersion"
          Write-Host "VC tools: $env:VCToolsVersion"
          Write-Host "Windows SDK: $env:WindowsSDKVersion"
          Write-Host "vcpkg ABI cache key suffix: $abiKey"

          "abi_key=$abiKey" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache vcpkg binary packages
        uses: actions/cache@v5
        with:
          path: .vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ steps.vcpkg-abi.outputs.abi_key }}-occt
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap vcpkg + install OCCT
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgRoot = "$env:RUNNER_TEMP\vcpkg"
          New-Item -ItemType Directory -Force $env:VCPKG_BINARY_CACHE | Out-Null
          git init $vcpkgRoot
          git -C $vcpkgRoot remote add origin https://github.com/microsoft/vcpkg.git
          git -C $vcpkgRoot fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C $vcpkgRoot checkout --detach FETCH_HEAD
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:VCPKG_BINARY_CACHE,readwrite"
          Push-Location $env:GITHUB_WORKSPACE
          & "$vcpkgRoot\vcpkg.exe" install "opencascade:$env:VCPKG_TRIPLET" --clean-after-build
          Pop-Location

          $cacheFiles = Get-ChildItem $env:VCPKG_BINARY_CACHE -Recurse -File
          $cacheSize = ($cacheFiles | Measure-Object -Property Length -Sum).Sum
          Write-Host "vcpkg binary cache files: $($cacheFiles.Count)"
          Write-Host "vcpkg binary cache size: $([Math]::Round($cacheSize / 1MB, 2)) MiB"

          "OCCT_ROOT=$vcpkgRoot\installed\$env:VCPKG_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create localization
        run: lrelease zima-cad-parts.pro

      - name: Configure build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build-ci | Out-Null
          Set-Location .build-ci
          qmake "OCCT_ROOT=$env:OCCT_ROOT" "OCCT_REQUIRED=1" ../zima-cad-parts.pro

      - name: Build project
        working-directory: .build-ci
        run: nmake release

      - name: Test packaging contracts
        run: python tests/test_distribution.py

      - name: Create versioned distribution
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $qtRoot = (qmake -query QT_INSTALL_PREFIX).Trim()
          $env:PATH = "$qtRoot/bin;$env:OCCT_ROOT/bin;$env:PATH"
          $packageArgs = @(
            "tools/distribution/package-windows.py",
            "--exe", ".build-ci/release/ZIMA-CAD-Parts.exe",
            "--qt", $qtRoot,
            "--occt", $env:OCCT_ROOT,
            "--output", ".dist-output/package"
          )
          if ("${{ github.ref_type }}" -eq "tag") { $packageArgs += "--release" }
          python @packageArgs
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }
          $manifest = Get-ChildItem .dist-output/package/ZIMA-CAD-Parts/windows/*/version.json |
            Select-Object -First 1 | Get-Content -Raw | ConvertFrom-Json
          $name = "ZIMA-CAD-Parts-$($manifest.version)-windows-x64"
          "release_name=ZIMA-CAD-Parts-$($manifest.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Test native launcher
        shell: pwsh
        run: |
          $env:PARTS_LAUNCHER = "$env:GITHUB_WORKSPACE/.dist-output/package/ZIMA-CAD-Parts/ZIMA-CAD-Parts.exe"
          python tests/test_distribution.py

      - name: Upload distribution
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: .dist-output/package/ZIMA-CAD-Parts/

      - name: Create release archive
        if: github.ref_type == 'tag'
        shell: pwsh
        run: Compress-Archive -Path .dist-output/package/ZIMA-CAD-Parts -DestinationPath "${{ steps.package.outputs.release_name }}.zip"

      - name: Upload release candidate
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ steps.package.outputs.release_name }}.zip
