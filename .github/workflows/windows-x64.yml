name: Windows x64 build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_COMMIT: 05925b52317eb9a900a8583782e630aafd7a8929
      VCPKG_TRIPLET: x64-windows
      VCPKG_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Qt (MSVC 2022, x64)
        uses: jurplel/install-qt-action@v4
        with:
          target: "desktop"
          arch: "win64_msvc2022_64"
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Cache vcpkg binary packages
        uses: actions/cache@v5
        with:
          path: .vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-msvc2022-occt
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-msvc2022-

      - name: Bootstrap vcpkg + install OCCT
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgRoot = "$env:RUNNER_TEMP\vcpkg"
          New-Item -ItemType Directory -Force $env:VCPKG_BINARY_CACHE | Out-Null
          git init $vcpkgRoot
          git -C $vcpkgRoot remote add origin https://github.com/microsoft/vcpkg.git
          git -C $vcpkgRoot fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C $vcpkgRoot checkout --detach FETCH_HEAD
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:VCPKG_BINARY_CACHE,readwrite"
          Push-Location $env:GITHUB_WORKSPACE
          & "$vcpkgRoot\vcpkg.exe" install "opencascade:$env:VCPKG_TRIPLET" --clean-after-build
          Pop-Location
          "OCCT_ROOT=$vcpkgRoot\installed\$env:VCPKG_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create localization
        run: lrelease zima-cad-parts.pro

      - name: Configure build
        shell: pwsh
        run: qmake "OCCT_ROOT=$env:OCCT_ROOT" zima-cad-parts.pro

      - name: Build project
        run: nmake release

      - name: Deploy (windeployqt)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item release\ZIMA-CAD-Parts.exe .\package\
          # Keep all OCCT exchange/runtime DLLs for STEP, IGES, and STL previews.
          Copy-Item "$env:OCCT_ROOT\bin\*.dll" .\package\ -Force
          New-Item -ItemType Directory -Force package\locale | Out-Null
          Copy-Item locale\*.qm package\locale\
          New-Item -ItemType Directory -Force package\licenses | Out-Null
          Copy-Item licenses\* package\licenses\ -Force
          windeployqt --release --compiler-runtime .\package\ZIMA-CAD-Parts.exe

      - name: Compute artifact name + zip name
        id: names
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $label = "${{ github.ref_name }}"      # tag name
          } else {
            $label = "git.$("${{ github.sha }}".Substring(0,9))"
          }
          $artifact = "ZIMA-CAD-Parts-$label-windows-x64"
          "artifact_name=$artifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_name=$artifact.zip"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Always upload the Actions artifact (folder upload = GitHub makes the zip)
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: package/**

      # Only for tag pushes: create a real ZIP and attach it to the GitHub Release
      - name: Create zip for Release asset
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          Compress-Archive -Path .\package\* -DestinationPath ${{ steps.names.outputs.zip_name }}

      - name: Create GitHub Release + upload asset
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.names.outputs.zip_name }}
