name: Linux distro builds

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  build-linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 26.04
            image: ghcr.io/zima-engineering/zcp-linux-build:ubuntu-26.04
          - name: Debian 13
            image: ghcr.io/zima-engineering/zcp-linux-build:debian-trixie
          - name: Fedora 44
            image: ghcr.io/zima-engineering/zcp-linux-build:fedora-44

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Resolve Qt tools
        run: |
          set -euxo pipefail

          find_tool() {
            variable="$1"
            shift

            for candidate in "$@"; do
              if command -v "$candidate" >/dev/null 2>&1; then
                echo "$variable=$(command -v "$candidate")" >> "$GITHUB_ENV"
                return
              fi

              if [ -x "$candidate" ]; then
                echo "$variable=$candidate" >> "$GITHUB_ENV"
                return
              fi
            done

            echo "Unable to find any candidate for $variable: $*" >&2
            exit 1
          }

          find_tool QMAKE qmake6 qmake /usr/lib/qt6/bin/qmake6 \
            /usr/lib/qt6/bin/qmake /usr/lib64/qt6/bin/qmake6 \
            /usr/lib64/qt6/bin/qmake
          find_tool LRELEASE lrelease-qt6 lrelease6 lrelease \
            /usr/lib/qt6/bin/lrelease /usr/lib64/qt6/bin/lrelease

      - name: Create localization
        run: |
          set -euxo pipefail
          "$LRELEASE" locale/zima-cad-parts_cs_CZ.ts

      - name: Configure build
        run: |
          set -euxo pipefail
          "$QMAKE" zima-cad-parts.pro 2>&1 | tee qmake.log
          grep -F "STEP/IGES/STL preview enabled" qmake.log

      - name: Build project
        run: |
          set -euxo pipefail
          make -j"$(nproc)"
