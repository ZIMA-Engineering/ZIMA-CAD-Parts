name: Debian 13 distribution
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build Debian toolchain image
        run: docker build --pull --build-arg BASE_IMAGE=debian:13 --build-arg DISTRO=debian -f .github/ci/linux-build.Dockerfile -t parts-debian-build .
      - name: Build and package on Debian
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --volume "$PWD:/workspace" --workdir /workspace --env HOME=/tmp
          parts-debian-build bash .github/ci/build-debian.sh
      - name: Upload experimental Debian package
        uses: actions/upload-artifact@v6
        with:
          name: ZIMA-CAD-Parts-debian-13-x86_64
          path: .dist-output/*.tar.gz
          if-no-files-found: error
