name: Linux CI images

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - "**"
    paths:
      - ".github/ci/linux-build.Dockerfile"
      - ".github/workflows/linux-ci-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 26.04 image
            base-image: ubuntu:26.04
            distro: ubuntu
            tag: ubuntu-26.04
          - name: Debian trixie image
            base-image: debian:trixie
            distro: debian
            tag: debian-trixie
          - name: Fedora 44 image
            base-image: fedora:44
            distro: fedora
            tag: fedora-44

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/ci/linux-build.Dockerfile
          pull: true
          no-cache: true
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base-image }}
            DISTRO=${{ matrix.distro }}
          tags: |
            ghcr.io/zima-engineering/zcp-linux-build:${{ matrix.tag }}
            ghcr.io/zima-engineering/zcp-linux-build:${{ matrix.tag }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
